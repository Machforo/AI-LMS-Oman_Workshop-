<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Traininglobe Hub</title>
<meta name="description" content="Sign in once to open AI Tools Playbook, AI Ascent, and Hands-on Practice." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap');
:root{
  --bg:#f3f6f4;--ink:#142033;--muted:#5b6777;--card:#fff;--line:#d7e0db;
  --accent:#0f7a6c;--accent-deep:#0b5a51;--accent-soft:#e4f4f0;--navy:#12324a;
  --shadow:0 18px 48px rgba(18,50,74,.12);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);font-family:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;line-height:1.6;
  background:
    radial-gradient(1000px 520px at 12% -10%, rgba(15,122,108,.18), transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(18,50,74,.14), transparent 52%),
    linear-gradient(165deg,#12324a 0%, #0b5a51 42%, #eef3f0 42%, var(--bg) 100%);
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
.shell{
  width:min(920px,100%);
  display:grid;grid-template-columns:1.05fr .95fr;gap:0;
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.55);
  border-radius:28px;overflow:hidden;box-shadow:var(--shadow);
}
.brand-pane{
  padding:2.4rem 2.2rem;color:#f4fffc;
  background:linear-gradient(145deg, rgba(18,50,74,.96), rgba(11,90,81,.92) 58%, rgba(15,122,108,.88));
  display:flex;flex-direction:column;justify-content:space-between;gap:2rem;min-height:520px;
}
.brand-pane h1{margin:0 0 .7rem;font-family:Fraunces,Georgia,serif;font-size:clamp(1.9rem,3.2vw,2.4rem);letter-spacing:-.02em}
.brand-pane p{margin:0;max-width:34ch;opacity:.94}
.form-pane{padding:2.3rem 2.1rem;display:flex;flex-direction:column;justify-content:center}
.form-pane h2{margin:0 0 .35rem;font-family:Fraunces,Georgia,serif;font-size:1.65rem;color:var(--navy)}
.form-lead{margin:0 0 1.25rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:.35rem;margin:0 0 1rem}
.field label{font-size:.9rem;font-weight:700;color:var(--navy)}
.field input{
  width:100%;font:inherit;border:1px solid #c9d5cf;border-radius:12px;padding:.85rem .95rem;outline:none;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.login-btn{
  border:0;border-radius:12px;padding:.9rem 1.2rem;cursor:pointer;width:100%;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;
  font:700 1rem "Source Sans 3",sans-serif;
}
.login-btn:disabled{opacity:.7;cursor:wait}
.error{margin:0 0 1rem;padding:.75rem .9rem;border-radius:10px;background:#fdeceb;color:#8a2f2a;font-weight:600}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .brand-pane{min-height:0;padding:1.6rem}
}
</style>
</head>
<body>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="sso.js"></script>
<script src="auth.js"></script>
<script>HubAuth.requireGuest('home.html');</script>
<div class="shell">
  <aside class="brand-pane">
    <div>
      <p style="margin:0 0 .8rem;opacity:.85;font-weight:600">Traininglobe</p>
      <h1>AI-Learning Management System</h1>
      <p>Open AI Tools Playbook, AI Ascent, or Hands-on Practice after a single sign-in.</p>
    </div>
  </aside>
  <main class="form-pane">
    <h2>Welcome back</h2>
    <p class="form-lead">Sign in with your Traininglobe hub account.</p>
    <p id="login-error" class="error" hidden></p>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="login-btn" type="submit" id="login-btn">Sign in</button>
    </form>
  </main>
</div>
<script>
(function () {
  var form = document.getElementById('login-form');
  var err = document.getElementById('login-error');
  var btn = document.getElementById('login-btn');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    HubAuth.login(
      document.getElementById('username').value,
      document.getElementById('password').value
    ).then(function (result) {
      btn.disabled = false;
      if (!result.ok) {
        err.textContent = result.error || 'Login failed.';
        err.hidden = false;
        return;
      }
      location.href = 'home.html';
    });
  });
})();
</script>
</body>
</html>
